<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AVELA Semijoias | Vista sua essência. Realce sua beleza.</title>
  <meta name="description" content="Semijoias em aço inox, pratas e peças personalizadas. Compre pelo WhatsApp. Guarulhos, SP.">

  <!-- Fontes: Playfair Display (títulos) e Inter (textos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<!-- data-pagina diz ao script.js qual página está aberta -->
<body data-pagina="home">

  <!-- O cabeçalho é montado pelo script.js (mesmo código em todas as páginas) -->
  <div id="cabecalho"></div>

  <main>
    <!-- BANNER DE BOAS-VINDAS -->
    <section class="hero">
      <div class="container hero__interno">
        <div class="hero__texto">
          <h1>Vista sua essência.<br>Realce sua beleza.</h1>
          <p>Semijoias em aço inox, pratas e peças personalizadas, escolhidas uma a uma em Guarulhos.</p>
          <a class="btn btn--bordo btn--grande" href="#vitrine">Ver a vitrine</a>
        </div>

        <!-- Círculo bordô: ecoa o círculo da logomarca -->
        <div class="hero__selo" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="96" height="96" fill="none" stroke="#F5F5F5" stroke-width="2.2" stroke-linejoin="round">
            <path d="M36 14h28l10 12-24 20-24-20z"/>
            <path d="M26 26h48M44 14l-4 12 10 20M56 14l4 12-10 20"/>
            <circle cx="50" cy="68" r="20"/>
            <circle cx="50" cy="68" r="15" stroke-width="1.2"/>
          </svg>
          <span>Aço inox<br>Pratas<br>Personalizados</span>
        </div>
      </div>
    </section>

    <!-- DESTAQUES (produtos marcados como "Sim" na coluna Destaque) -->
    <section class="secao container" id="destaques" hidden>
      <h2 class="secao__titulo">Destaques</h2>
      <div class="grade" id="grade-destaques"></div>
    </section>

    <!-- CATÁLOGO COM FILTROS -->
    <section class="secao container" id="vitrine">
      <h2 class="secao__titulo">Vitrine</h2>

      <div class="filtros" role="group" aria-label="Filtrar por categoria">
        <button class="filtro ativo" data-categoria="todos">Todos</button>
        <button class="filtro" data-categoria="Aço Inox">Aço Inox</button>
        <button class="filtro" data-categoria="Pratas">Pratas</button>
        <button class="filtro" data-categoria="Personalizados">Personalizados</button>
        <button class="filtro" data-categoria="favoritos">Favoritos</button>
      </div>

      <div class="grade" id="grade"></div>
      <p class="vazio" id="vazio" hidden></p>
    </section>
  </main>

  <div id="rodape"></div>

  <script src="script.js"></script>
</body>
</html>
