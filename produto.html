<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto | AVELA Semi Joias</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body data-pagina="produto">

  <div id="cabecalho"></div>

  <!-- O script.js preenche esta área com o produto do endereço (produto.html?id=3) -->
  <main class="container" id="produto">
    <p class="carregando">Carregando produto...</p>
  </main>

  <!-- Sugestões da mesma categoria -->
  <section class="secao container" id="relacionados" hidden>
    <h2 class="secao__titulo">Combina com este</h2>
    <div class="grade" id="grade-relacionados"></div>
  </section>

  <div id="rodape"></div>

  <!-- Foto ampliada (abre ao clicar na foto do produto; o script.js controla) -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <button class="lightbox__fechar" id="lightbox-fechar" type="button" aria-label="Fechar">×</button>
    <button class="lightbox__seta lightbox__seta--ant" id="lightbox-ant" type="button" aria-label="Foto anterior">‹</button>
    <img class="lightbox__img" id="lightbox-img" alt="">
    <button class="lightbox__seta lightbox__seta--prox" id="lightbox-prox" type="button" aria-label="Próxima foto">›</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
